name: local-llama

services:
  api:
    build:
      context: .
      dockerfile: DockerFile
    ports:
      - "8000:8000"
    environment:
      # Defaults to the Ollama running natively on the Mac, which keeps Metal.
      # scripts/start.sh --with-ollama overrides this to http://ollama:11434.
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      MODEL: ${MODEL:-llama3.2:1b}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      # Mounted, not baked in: edit index.html and just refresh, no rebuild.
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

  # Opt-in only (scripts/start.sh --with-ollama). CPU-only on macOS -- no Metal
  # inside the Docker VM -- and re-downloads the model into its own volume.
  ollama:
    profiles: ["with-ollama"]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  ollama-data:
