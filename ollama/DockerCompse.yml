name: local-llama

services:
  # Self-contained: the model lives in the ollama-data volume, not on the host.
  # No Metal inside the Docker VM, so this runs on CPU.
  ollama:
    image: ollama/ollama:latest
    ports:
      # Published so main.ipynb can still reach localhost:11434 unchanged.
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: DockerFile
    ports:
      - "8000:8000"
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      MODEL: ${MODEL:-llama3.2:1b}
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      # Same trick as the UI below: edit backend/main.py and uvicorn --reload
      # restarts in-place. No rebuild in the refinement loop at all.
      - ./backend:/app
      # Library files, bind-mounted so the folder tree is browsable from Finder.
      - ./storage:/app/storage
      # The SQLite file stays in a named volume instead: WAL locking over a
      # macOS bind mount is unreliable, and this is metadata, not content.
      - library-data:/app/data
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    restart: unless-stopped

  web:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      # Mounted, not baked in: edit index.html and just refresh, no rebuild.
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  ollama-data:
  library-data:
