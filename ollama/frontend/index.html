<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Llama 3.2</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/library.css" />
<link rel="stylesheet" href="css/viewer.css" />
<link rel="stylesheet" href="css/picker.css" />
</head>
<body>

<header>
  <div class="lead">
    <button id="library-btn" class="nav-btn" type="button">
      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M2.5 5.5a1.5 1.5 0 0 1 1.5-1.5h3.2l1.6 1.8h7.7a1.5 1.5 0 0 1 1.5 1.5v7.2a1.5 1.5 0 0 1-1.5 1.5H4a1.5 1.5 0 0 1-1.5-1.5z"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
      Library
    </button>
  </div>
  <div>
    <h1>Llama 3.2</h1>
    <p class="sub">
      <span id="status">local</span>
    </p>
  </div>
  <div class="trail"></div>
</header>

<div id="backdrop"></div>

<aside id="panel" aria-label="Library" aria-hidden="true">
  <div class="panel-head">
    <div>
      <button id="panel-back" class="nav-btn" type="button" hidden>
        <svg width="11" height="16" viewBox="0 0 11 16" aria-hidden="true">
          <path d="M8.5 2 2.5 8l6 6" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Library
      </button>
    </div>
    <h2 id="panel-title">Library</h2>
    <div style="justify-self: end">
      <button id="panel-close" class="nav-btn" type="button">Done</button>
    </div>
  </div>
  <div id="panel-body"></div>
  <div class="panel-foot" id="panel-foot"></div>
</aside>

<input type="file" id="file-input" multiple hidden />

<!-- Presented full-screen over everything, the way QuickLook does: the panel
     is 340px wide, which side-by-side panes can't live in. -->
<div id="viewer" aria-hidden="true">
  <div class="viewer-head">
    <div>
      <button id="viewer-close" class="nav-btn" type="button">
        <svg width="11" height="16" viewBox="0 0 11 16" aria-hidden="true">
          <path d="M8.5 2 2.5 8l6 6" fill="none" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Back
      </button>
    </div>
    <h2 id="viewer-title"></h2>
    <div style="justify-self: end">
      <!-- Mirrors the leading Back item: same glyph-plus-label shape. -->
      <a id="viewer-download" class="nav-btn" rel="noopener">
        <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M10 2.75v9.5m-3.75-3.75L10 12.25l3.75-3.75"
                fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M4 13v2.5a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5V13"
                fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        Download
      </a>
    </div>
  </div>

  <!-- Only shown when the window is too narrow for both panes. -->
  <div class="seg-wrap">
    <div class="seg" id="viewer-seg" role="tablist">
      <button type="button" data-pane="doc" class="on" role="tab">Document</button>
      <button type="button" data-pane="text" role="tab">Extracted</button>
    </div>
  </div>

  <div class="viewer-body">
    <section class="pane" data-pane="doc">
      <div class="pane-head">Original</div>
      <div class="pane-body" id="viewer-doc"></div>
    </section>
    <section class="pane" data-pane="text">
      <div class="pane-head">Extracted markdown <span id="viewer-chars"></span></div>
      <div class="pane-body"><div id="viewer-text" class="md"></div></div>
    </section>
  </div>
</div>

<div id="log"></div>

<footer>
  <!-- The 📎 menu: opens above the composer, lined up with it. -->
  <div id="picker" role="dialog" aria-label="Attach to chat" hidden>
    <div class="picker-head">
      <div>
        <button id="picker-back" class="nav-btn" type="button" hidden>
          <svg width="11" height="16" viewBox="0 0 11 16" aria-hidden="true">
            <path d="M8.5 2 2.5 8l6 6" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Folders
        </button>
      </div>
      <h2 id="picker-title">Attach</h2>
      <span id="picker-count"></span>
    </div>
    <p id="picker-note" role="status" hidden></p>
    <div id="picker-body"></div>
    <div class="picker-foot">
      <button id="picker-done" class="action" type="button">Done</button>
    </div>
  </div>
  <input type="file" id="attach-input" multiple hidden />

  <div id="indexing" role="status" aria-live="polite" hidden></div>
  <div id="scope" hidden></div>
  <form id="form">
    <button id="attach" type="button" aria-label="Attach folders or files"
            aria-haspopup="dialog" aria-controls="picker" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true">
        <path d="m15.5 9.5-5.8 5.8a3.6 3.6 0 0 1-5.1-5.1l6.4-6.4a2.4 2.4 0 0 1 3.4 3.4l-6.3 6.3a1.2 1.2 0 0 1-1.7-1.7l5.6-5.6"
              fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="field">
      <textarea id="input" rows="1" placeholder="Message" autofocus></textarea>
    </div>
    <button id="send" type="submit" aria-label="Send">
      <svg width="17" height="17" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 13.25V3.25M3.5 7.75 8 3.25l4.5 4.5"
              fill="none" stroke="currentColor" stroke-width="2.25"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </form>
</footer>

<script type="module" src="js/main.js"></script>

</body>
</html>
