<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Llama 3.2</title>
<style>
  :root {
    --bg: #ffffff;
    --header-bg: rgba(255, 255, 255, 0.72);
    --sep: rgba(60, 60, 67, 0.18);
    --text: #000000;
    --secondary: #8e8e93;
    --bubble-them: #e9e9eb;
    --bubble-me: #007aff;
    --field: #ffffff;
    --field-border: rgba(60, 60, 67, 0.22);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --header-bg: rgba(28, 28, 30, 0.72);
      --sep: rgba(84, 84, 88, 0.5);
      --text: #ffffff;
      --secondary: #98989d;
      --bubble-them: #26262a;
      --bubble-me: #0a84ff;
      --field: #1c1c1e;
      --field-border: rgba(84, 84, 88, 0.6);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    font-size: 17px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  header {
    position: sticky;
    top: 0;
    padding: 14px 20px calc(14px + env(safe-area-inset-top));
    text-align: center;
    background: var(--header-bg);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid var(--sep);
    z-index: 10;
  }

  header h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  header .sub {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--secondary);
  }

  /* Chevron drawn as an inline SVG data URI -- no external asset can load here. */
  #mode {
    appearance: none;
    -webkit-appearance: none;
    padding: 1px 16px 1px 8px;
    font: inherit;
    font-weight: 500;
    color: var(--bubble-me);
    background-color: transparent;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23007aff' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 4px center;
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }

  #mode:hover { background-color: rgba(127, 127, 127, 0.16); }
  #mode:focus-visible { outline: 2px solid var(--bubble-me); outline-offset: 1px; }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
  }

  .row { display: flex; }
  .row.me { justify-content: flex-end; }

  .bubble {
    max-width: min(75%, 560px);
    padding: 9px 14px;
    border-radius: 20px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    animation: pop 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2);
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(6px) scale(0.97); }
    to   { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .bubble { animation: none; }
    #log { scroll-behavior: auto; }
  }

  .me .bubble {
    background: var(--bubble-me);
    color: #fff;
    border-bottom-right-radius: 6px;
  }

  .them .bubble {
    background: var(--bubble-them);
    color: var(--text);
    border-bottom-left-radius: 6px;
  }

  .them .bubble.error {
    color: #ff3b30;
    font-size: 15px;
  }

  /* Rendered markdown: block elements supply their own spacing, so the
     pre-wrap used for plain text would double every gap. */
  .bubble.md { white-space: normal; }
  .md > :first-child { margin-top: 0; }
  .md > :last-child { margin-bottom: 0; }
  .md p { margin: 0 0 8px; }
  .md h1, .md h2, .md h3, .md h4 {
    margin: 12px 0 6px;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .md ul, .md ol { margin: 6px 0; padding-left: 22px; }
  .md li { margin: 3px 0; }
  .md strong { font-weight: 600; }
  .md a { color: inherit; text-decoration: underline; }
  .md code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 14px;
    background: rgba(127, 127, 127, 0.2);
    padding: 1px 5px;
    border-radius: 5px;
  }
  .md pre {
    margin: 8px 0;
    padding: 10px 12px;
    background: rgba(127, 127, 127, 0.16);
    border-radius: 12px;
    overflow-x: auto;
  }
  .md pre code { background: none; padding: 0; font-size: 13px; }

  /* Three-dot typing indicator, shown until the first token lands. */
  .dots { display: inline-flex; gap: 4px; padding: 3px 2px; }
  .dots i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--secondary);
    animation: blink 1.3s infinite ease-in-out both;
  }
  .dots i:nth-child(2) { animation-delay: 0.16s; }
  .dots i:nth-child(3) { animation-delay: 0.32s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40%           { opacity: 1;    transform: scale(1); }
  }

  footer {
    position: sticky;
    bottom: 0;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--header-bg);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 0.5px solid var(--sep);
  }

  form {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    max-width: 760px;
    margin: 0 auto;
  }

  /* The pill is this wrapper, not the textarea. A scrollbar renders at the
     padding-box edge, so padding-right can't move it -- only giving the
     textarea its own right margin inside the wrapper pulls it off the border. */
  .field {
    flex: 1;
    display: flex;
    padding: 8px 6px 8px 14px;
    background: var(--field);
    border: 1px solid var(--field-border);
    border-radius: 20px;
  }

  .field:focus-within { border-color: var(--bubble-me); }

  textarea {
    flex: 1;
    resize: none;
    max-height: 140px;
    margin-right: 8px;
    padding: 0;
    font: inherit;
    /* 22 + 16 padding + 2 border = a 40px pill, so the send circle lines up. */
    line-height: 22px;
    color: var(--text);
    background: none;
    border: 0;
    outline: none;
    scrollbar-width: thin;
    scrollbar-color: var(--secondary) transparent;
  }

  textarea::-webkit-scrollbar { width: 5px; }
  textarea::-webkit-scrollbar-track { background: transparent; }
  textarea::-webkit-scrollbar-thumb {
    background: var(--secondary);
    border-radius: 3px;
  }

  /* 38px against the pill's 40px: bottom-aligned, so a near match keeps the two
     from stepping. The arrow is drawn, not typed -- the system font's U+2191 is
     too light here and sits on its baseline rather than optically centred. */
  button {
    flex: none;
    display: grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 50%;
    background: var(--bubble-me);
    color: #fff;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  button svg { display: block; }

  button:disabled { opacity: 0.35; cursor: default; }
  button:not(:disabled):active { transform: scale(0.92); }
</style>
</head>
<body>

<header>
  <h1>Llama 3.2</h1>
  <p class="sub">
    <select id="mode" aria-label="Mode">
      <option value="chat">Chat</option>
      <option value="generate">Generate</option>
    </select>
    <span id="status">local</span>
  </p>
</header>

<div id="log"></div>

<footer>
  <form id="form">
    <div class="field">
      <textarea id="input" rows="1" placeholder="Message" autofocus></textarea>
    </div>
    <button id="send" type="submit" aria-label="Send">
      <svg width="17" height="17" viewBox="0 0 16 16" aria-hidden="true">
        <path d="M8 13.25V3.25M3.5 7.75 8 3.25l4.5 4.5"
              fill="none" stroke="currentColor" stroke-width="2.25"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </form>
</footer>

<script>
const API = "http://localhost:8000";

const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const status = document.getElementById("status");
const modeSelect = document.getElementById("mode");

// Ollama keeps no history, so the full transcript is resent every turn.
// Generate mode never touches this: a raw completion has no conversation.
const history = [];

modeSelect.addEventListener("change", () => {
  input.placeholder = modeSelect.value === "generate" ? "Text to continue…" : "Message";
  input.focus();
});

// --- Minimal markdown renderer ------------------------------------------
// The model emits markdown, and nothing external is loadable here (the page is
// served offline by nginx), so this covers the subset an LLM actually produces:
// headings, bold/italic, inline + fenced code, lists, links.

function escapeHtml(s) {
  return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function inlineMd(s) {
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    // Only http(s) becomes a link -- never javascript:, which would execute
    // whatever the model happened to generate.
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, text, href) =>
      /^https?:\/\//i.test(href) ? `<a href="${href}" target="_blank" rel="noopener">${text}</a>` : m);
}

function renderMarkdown(src) {
  // Escaped up front, so everything below composes tags around inert text.
  const lines = escapeHtml(src).split("\n");
  let html = "", inCode = false, code = "";

  // Open lists, outermost first, so indented items nest instead of closing the
  // parent -- otherwise a sub-bullet ends the <ol> and the next item restarts at 1.
  const stack = [];
  const closeOne = () => {
    const top = stack.pop();
    if (top.liOpen) html += "</li>";
    html += `</${top.tag}>`;
  };
  const closeTo = indent => {
    while (stack.length && stack[stack.length - 1].indent > indent) closeOne();
  };
  const closeAll = () => { while (stack.length) closeOne(); };

  for (const line of lines) {
    if (line.trim().startsWith("```")) {
      if (inCode) { html += `<pre><code>${code}</code></pre>`; code = ""; inCode = false; }
      else { closeAll(); inCode = true; }
      continue;
    }
    if (inCode) { code += line + "\n"; continue; }
    if (!line.trim()) continue; // blank lines don't end a list; indentation does

    const heading = line.match(/^(#{1,4})\s+(.*)$/);
    if (heading) {
      closeAll();
      const level = heading[1].length;
      html += `<h${level}>${inlineMd(heading[2])}</h${level}>`;
      continue;
    }

    // llama3.2 emits "• " far more often than "- " or "* ", so accept both.
    const ul = line.match(/^([ \t]*)[-*+•·‣]\s+(.*)$/);
    const ol = line.match(/^([ \t]*)\d+[.)]\s+(.*)$/);
    if (ul || ol) {
      const [, lead, content] = ul || ol;
      const tag = ul ? "ul" : "ol";
      const indent = lead.replace(/\t/g, "    ").length;

      closeTo(indent);
      let top = stack[stack.length - 1];
      if (!top || top.indent < indent) {
        // Nested list opens inside the parent's still-open <li>.
        html += `<${tag}>`;
        stack.push({ tag, indent, liOpen: false });
      } else if (top.tag !== tag) {
        closeOne();
        html += `<${tag}>`;
        stack.push({ tag, indent, liOpen: false });
      }
      top = stack[stack.length - 1];
      if (top.liOpen) html += "</li>";
      html += `<li>${inlineMd(content)}`;
      top.liOpen = true;
      continue;
    }

    closeAll();
    html += `<p>${inlineMd(line)}</p>`;
  }

  // Mid-stream the closing fence hasn't arrived yet; render what's there.
  if (inCode) html += `<pre><code>${code}</code></pre>`;
  closeAll();
  return html;
}

fetch(API + "/health")
  .then(r => r.json())
  .then(d => { status.textContent = d.ok ? "· " + d.model : "· Ollama unreachable"; })
  .catch(() => { status.textContent = "backend unreachable"; });

function addBubble(who, text) {
  const row = document.createElement("div");
  row.className = "row " + who;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  row.appendChild(bubble);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return bubble;
}

// Grow the field with the text, up to the CSS max-height.
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = input.scrollHeight + "px";
});

// Enter sends, Shift+Enter makes a newline.
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

form.addEventListener("submit", async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || send.disabled) return;

  const mode = modeSelect.value;
  const chatting = mode === "chat";

  addBubble("me", text);
  // In generate mode the turn is standalone, so it stays out of the transcript.
  if (chatting) history.push({ role: "user", content: text });
  input.value = "";
  input.style.height = "auto";
  send.disabled = true;

  const bubble = addBubble("them", "");
  bubble.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>';
  let reply = "";

  // Re-rendering markdown on every token is wasted work at 40 tok/s; coalesce
  // to one paint per frame instead.
  let queued = false;
  const paint = () => {
    bubble.innerHTML = renderMarkdown(reply);
    log.scrollTop = log.scrollHeight;
  };
  const schedulePaint = () => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => { queued = false; paint(); });
  };

  try {
    const res = await fetch(API + "/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        messages: chatting ? history : [{ role: "user", content: text }],
        mode,
      }),
    });
    if (!res.ok) throw new Error("HTTP " + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    // NDJSON: a chunk can split mid-line, so hold the remainder in the buffer.
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.trim()) continue;
        const msg = JSON.parse(line);
        if (msg.error) throw new Error(msg.error);
        if (msg.token) {
          if (!reply) bubble.classList.add("md"); // first token clears the dots
          reply += msg.token;
          schedulePaint();
        }
      }
    }

    if (reply) {
      paint(); // the last scheduled frame may not have run yet
      if (chatting) history.push({ role: "assistant", content: reply });
    } else {
      bubble.textContent = "(empty response)";
    }
  } catch (err) {
    bubble.classList.remove("md");
    bubble.classList.add("error");
    bubble.textContent = "⚠︎ " + err.message;
    if (chatting) history.pop(); // drop the unanswered turn so the next isn't poisoned
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>

</body>
</html>
