# The web service's server block, mounted over nginx's default.conf.
#
# no-cache means "check before reusing your copy", not "don't cache": an
# unchanged file still comes back as a cheap 304. Without it, a normal refresh
# rechecks only the page itself, so an edited js/ or css/ file could stay stale
# in the browser for hours.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    add_header Cache-Control "no-cache";
}
